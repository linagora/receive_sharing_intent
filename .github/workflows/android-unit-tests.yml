name: Android unit tests

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/android-test-host/**'
      - '.github/workflows/android-unit-tests.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/android-test-host/**'
      - '.github/workflows/android-unit-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      - name: Run unit tests
        run: gradle -p .github/android-test-host :receive_sharing_intent:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android/build/reports/tests/
